<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>熊之平衡</title>
<meta name="description" content="三局两胜的比点卡牌对决：人机对战、快速匹配或用房间号和朋友联机。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=ZCOOL+XiaoWei&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: a single felt table, opponent on top, a balance beam in the middle that tilts toward the heavier side, your hand at the bottom. */
:root{
  --felt:#13261e; --felt-2:#1a3329; --rail:#2b483a; --rail-2:#3a5d4c;
  --ink:#e8eee4; --muted:#93a99b;
  --honey:#e3a83c; --honey-ink:#2a1c06;
  --paper:#efe8d8; --paper-edge:#d3c9b1;
  --lo:#3d6e8f; --hi:#b3432a;
  --swap:#6fb6dc; --swap-ink:#0b2230;
  --good:#86c896; --bad:#e8826a; --tie:#d2bd6c;
  --shade:rgba(4,10,7,.55); --scrim:rgba(6,14,10,.78);
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong","SimSun",serif;
  --f-num:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --hand-w:clamp(52px,9.4vw,78px);
  --board-w:clamp(34px,6.6vw,54px);
  color-scheme:dark;
}
html{background:var(--felt)}
body{background:radial-gradient(ellipse 90% 60% at 50% 45%,var(--felt-2),var(--felt) 75%) fixed;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--f-display);font-weight:400;font-size:34px;letter-spacing:.08em;margin:0;color:var(--honey)}
.rounds{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.rounds li{display:flex;flex-direction:column;align-items:center;min-width:70px;padding:5px 10px;border:1px solid var(--rail);border-radius:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rounds li b{font-weight:500;letter-spacing:.06em}
.rounds li.cur{border-color:var(--honey);color:var(--ink)}
.rounds li.win{border-color:var(--good);color:var(--good)}
.rounds li.lose{border-color:var(--bad);color:var(--bad)}
.rounds li.tie{border-color:var(--tie);color:var(--tie)}

.side{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--rail);border-radius:12px;background:color-mix(in oklab,var(--felt) 70%,transparent)}
.side.turn{border-color:var(--honey);box-shadow:0 0 0 1px color-mix(in oklab,var(--honey) 40%,transparent)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.who{font-family:var(--f-display);font-size:22px;letter-spacing:.06em}
.pips{display:inline-flex;gap:4px}
.pips i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--honey);display:inline-block}
.pips i.on{background:var(--honey)}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--rail-2);color:var(--muted)}
.tag.hot{border-color:var(--honey);color:var(--honey)}
.tag.off{border-color:var(--bad);color:var(--bad)}
.spacer{flex:1}
.count{color:var(--muted);font-variant-numeric:tabular-nums}

.board{display:flex;flex-wrap:wrap;gap:5px;min-height:calc(var(--board-w)*1.4 + 2px);align-items:center}
.board .card{--cw:var(--board-w)}
.board .empty{color:var(--muted);font-size:12px;opacity:.7}
.bonus{display:grid;place-items:center;width:var(--board-w);aspect-ratio:5/7;border-radius:6px;border:1.5px dashed var(--honey);color:var(--honey);font-family:var(--f-num);font-size:15px;line-height:1.1;text-align:center}
.bonus small{font-family:var(--f-body);font-size:10px;display:block}
.backs{display:flex;gap:3px;flex-wrap:wrap}
.back{width:22px;aspect-ratio:5/7;border-radius:3px;border:1px solid color-mix(in oklab,var(--honey) 45%,transparent);background:repeating-linear-gradient(45deg,var(--rail) 0 3px,var(--felt-2) 3px 6px)}

.card{--cw:var(--hand-w);--cc:color-mix(in oklab,var(--lo),var(--hi) calc(var(--v)*100%));width:var(--cw);aspect-ratio:5/7;border-radius:7px;background:var(--paper);color:var(--cc);border:1px solid var(--paper-edge);position:relative;display:grid;place-items:center;font-family:var(--f-num);box-shadow:0 2px 0 var(--shade),0 8px 14px -10px var(--shade);padding:0;font-size:inherit;flex:none}
.card::after{content:"";position:absolute;inset:3px;border:1px solid color-mix(in oklab,var(--cc) 35%,transparent);border-radius:5px;pointer-events:none}
.card .big{font-size:calc(var(--cw)*.5);line-height:1;font-variant-numeric:tabular-nums}
.card .ix{position:absolute;top:2px;left:5px;font-size:calc(var(--cw)*.19);line-height:1.2}
button.card{cursor:default}
button.card:not([disabled]){cursor:pointer;transition:transform .15s ease}
button.card:not([disabled]):hover,button.card:not([disabled]):focus-visible{transform:translateY(-6px)}
button.card:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
.hand.idle .card{filter:saturate(.55) brightness(.82)}
.hand button.card.sel,.hand button.card.sel:hover{transform:translateY(-10px);box-shadow:0 0 0 2px var(--honey),0 10px 18px -8px var(--shade)}
.hand button.card.sel::before{content:attr(data-badge);position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--honey);color:var(--honey-ink);font-family:var(--f-body);font-size:12px;display:grid;place-items:center;opacity:1;z-index:1}
.hand.mull button.card.sel::before{background:var(--swap);color:var(--swap-ink)}
.phase{display:inline-flex;align-items:center;gap:8px;padding:5px 18px 5px 12px;border-radius:999px;border:1.5px solid currentColor;font-family:var(--f-display);font-size:20px;letter-spacing:.14em;line-height:1.2}
.phase svg{width:20px;height:20px;flex:none}
.phase small{font-family:var(--f-body);font-size:12px;letter-spacing:.04em;opacity:.85}
.phase:empty{display:none}
.phase.mull{color:var(--swap);background:color-mix(in oklab,var(--swap) 13%,transparent)}
.phase.play{color:var(--honey);background:color-mix(in oklab,var(--honey) 13%,transparent)}
.phase.auto{color:var(--tie);background:color-mix(in oklab,var(--tie) 13%,transparent)}
.phase.idle{color:var(--muted)}
.app.ph-mull #mySide{border-color:var(--swap);border-style:dashed;box-shadow:0 0 0 1px color-mix(in oklab,var(--swap) 40%,transparent);background:color-mix(in oklab,var(--swap) 8%,var(--felt))}
.app.ph-mull .board{opacity:.35}
.app.ph-mull .hand button.card:not([disabled]){box-shadow:0 0 0 2px color-mix(in oklab,var(--swap) 75%,transparent)}
.app.ph-mull .hand button.card.sel,.app.ph-mull .hand button.card.sel:hover{box-shadow:0 0 0 3px var(--swap),0 10px 18px -8px var(--shade)}
.app.ph-play #mySide.turn{background:color-mix(in oklab,var(--honey) 7%,var(--felt))}
.btn.rps{min-width:76px;font-size:16px}
.card.new{animation:drop .38s cubic-bezier(.2,1.3,.5,1) both}
@keyframes drop{from{transform:translateY(-14px) scale(1.08);opacity:0}to{transform:none;opacity:1}}
.hand{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding-top:8px;min-height:calc(var(--hand-w)*1.4 + 8px)}

.center{display:flex;flex-direction:column;align-items:center;gap:10px}
.scale{position:relative;height:128px;width:300px;max-width:100%}
.post{position:absolute;left:50%;top:38px;bottom:12px;width:4px;margin-left:-2px;background:var(--rail-2);border-radius:2px}
.foot{position:absolute;left:50%;bottom:4px;width:70px;height:8px;margin-left:-35px;background:var(--rail-2);border-radius:4px 4px 2px 2px}
.pivot{position:absolute;left:50%;top:33px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--honey);z-index:2}
.beam{position:absolute;left:50%;top:37px;width:220px;height:4px;margin-left:-110px;background:var(--honey);border-radius:2px;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.pan{position:absolute;top:39px;width:96px;margin-left:-48px;display:flex;flex-direction:column;align-items:center;transition:transform .6s cubic-bezier(.3,1.5,.5,1)}
.pan.l{left:calc(50% - 110px)} .pan.r{left:calc(50% + 110px)}
.pan .str{width:1px;height:14px;background:var(--muted)}
.pan .bowl{min-width:78px;padding:2px 8px 4px;border-bottom:3px solid var(--honey);border-radius:0 0 40px 40px;text-align:center}
.pan .num{font-family:var(--f-num);font-size:38px;line-height:1.05;font-variant-numeric:tabular-nums}
.pan .lbl{font-size:11px;color:var(--muted);letter-spacing:.1em}
.status{text-align:center;min-height:3em;max-width:46ch;font-size:17px;color:var(--ink);text-wrap:balance}
.status .note{display:block;color:var(--muted);font-size:12.5px}
.status .swapleft{display:block;width:max-content;margin:0 auto 6px;padding:3px 16px;border-radius:999px;background:var(--swap);color:var(--swap-ink);font-size:15px;font-weight:600;letter-spacing:.04em}
.status .swapleft b{font-family:var(--f-num);font-size:21px;font-weight:400;margin-inline:2px}
.status .clock{display:block;margin-top:4px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status .clock.urgent{color:var(--bad);font-weight:600}
.actions .or,#actions .or{align-self:center;color:var(--muted);font-size:13px;padding-inline:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:40px}
.btn{font:inherit;font-size:16px;padding:10px 24px;border-radius:999px;border:1.5px solid var(--honey);background:var(--honey);color:var(--honey-ink);cursor:pointer;letter-spacing:.06em}
.btn.ghost{background:transparent;color:var(--honey)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.aside{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.chip{font-family:var(--f-num);font-size:14px;min-width:28px;text-align:center;padding:1px 4px;border-radius:5px;border:1px solid var(--rail-2);color:var(--ink);font-variant-numeric:tabular-nums}
.chip.out{opacity:.28;text-decoration:line-through}
.chip.set{border-style:dashed;color:var(--muted)}

.info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.info{grid-template-columns:1fr}}
.panel{border:1px solid var(--rail);border-radius:12px;padding:10px 12px;min-width:0}
.panel h2{font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.panel p{margin:6px 0 0;font-size:12px;color:var(--muted)}
details.panel summary{cursor:pointer;font-size:13px;letter-spacing:.1em;color:var(--muted)}
.log{margin:8px 0 0;padding-left:1.4em;max-height:220px;overflow:auto;font-size:13px;font-variant-numeric:tabular-nums}
.log li{padding:1px 0}
.log li.r{color:var(--honey)}

.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:20px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px))}
.dialog{width:min(540px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--felt-2);border:1px solid var(--rail-2);border-radius:16px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px var(--shade)}
.dialog h2{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0;letter-spacing:.06em;color:var(--honey);text-wrap:balance}
.dialog ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.dialog .big-score{font-family:var(--f-num);font-size:44px;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}
.dialog .big-score span{font-family:var(--f-body);font-size:14px;color:var(--muted);margin:0 8px;vertical-align:middle}
.dialog .verdict{text-align:center;font-size:17px}
.dialog .verdict.win{color:var(--good)} .dialog .verdict.lose{color:var(--bad)} .dialog .verdict.tie{color:var(--tie)}
.dialog table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.dialog td,.dialog th{padding:4px 6px;border-bottom:1px solid var(--rail);text-align:center;font-weight:400}
.dialog th{color:var(--muted);font-size:12px}
.dialog .row{display:flex;justify-content:center;gap:10px}
.muted{color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .btn{width:100%}
.modes .full{grid-column:1/-1}
.join{grid-column:1/-1;display:flex;gap:10px}
.modes .join .btn{width:auto;flex:none;padding-inline:26px}
.join input{flex:1 1 auto;width:100%;min-width:0;font:inherit;font-family:var(--f-num);font-size:26px;letter-spacing:.3em;text-transform:uppercase;padding:8px 18px;text-align:center;border-radius:999px;border:1.5px solid var(--rail-2);background:var(--felt);color:var(--ink)}
.join input:focus-visible{outline:2px solid var(--honey);outline-offset:1px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.code{font-family:var(--f-num);font-size:44px;letter-spacing:.25em;text-align:center;color:var(--honey);user-select:all}
.err{color:var(--bad);font-size:13px;margin:0;text-align:center}
.dialog details summary{cursor:pointer;color:var(--muted);font-size:13px}
.dialog details ul{margin-top:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--rail-2);border-top-color:var(--honey);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.mode-tag{font-size:12px;color:var(--muted);border:1px solid var(--rail-2);border-radius:999px;padding:1px 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* motion */
.card-ghost{position:fixed;margin:0;z-index:25;pointer-events:none}
.fx{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--scrim);padding:20px max(16px,env(safe-area-inset-left,0px)) 20px max(16px,env(safe-area-inset-right,0px));cursor:pointer}
.fx-box{display:flex;flex-direction:column;align-items:center;gap:18px;background:var(--felt-2);border:1px solid var(--rail-2);border-radius:18px;padding:26px 30px;box-shadow:0 30px 60px -30px var(--shade);width:min(440px,100%)}
.rps-row{display:flex;gap:clamp(16px,6vw,44px);align-items:center}
.rps-side{display:flex;flex-direction:column;align-items:center;gap:8px}
.rps-side .lbl{color:var(--muted);letter-spacing:.12em}
.hand-ico{width:clamp(84px,24vw,112px);aspect-ratio:1;color:var(--paper)}
.hand-ico svg{width:100%;height:100%;display:block}
.hand-ico.opp svg{transform:scaleX(-1)}
.hand-ico.shake{animation:shake .32s ease-in-out 3;transform-origin:50% 90%}
@keyframes shake{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(-8deg)}}
.hand-ico.reveal{animation:pop .4s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop{from{transform:scale(.55);opacity:.3}to{transform:none;opacity:1}}
.hand-ico.won{color:var(--honey);filter:drop-shadow(0 0 14px color-mix(in oklab,var(--honey) 60%,transparent))}
.rps-vs{font-family:var(--f-num);font-size:22px;color:var(--muted);letter-spacing:.1em}
.rps-res{font-size:19px;min-height:1.6em;text-align:center}
.rps-res.win{color:var(--good)}.rps-res.lose{color:var(--bad)}.rps-res.tie{color:var(--tie)}
.settle{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--rail)}
.srow.won{animation:glow .5s ease var(--d) both}
@keyframes glow{to{border-color:var(--honey);background:color-mix(in oklab,var(--honey) 12%,transparent)}}
.who2{font-family:var(--f-display);font-size:19px}
.schips{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.schip{--cc:color-mix(in oklab,var(--lo),var(--hi) calc(var(--v)*100%));width:28px;aspect-ratio:5/7;border-radius:4px;background:var(--paper);color:var(--cc);font-family:var(--f-num);font-size:14px;display:grid;place-items:center;animation:chipIn .32s cubic-bezier(.2,1.5,.5,1) both}
.schip.bonus-chip{background:transparent;border:1.5px dashed var(--honey);color:var(--honey);font-size:12px}
@keyframes chipIn{from{transform:translateY(-10px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.stot{font-family:var(--f-num);font-size:34px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.stamp{align-self:center;font-family:var(--f-display);font-size:24px;letter-spacing:.08em;padding:4px 18px;border:3px solid currentColor;border-radius:10px;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both}
.stamp.win{color:var(--good)}.stamp.lose{color:var(--bad)}.stamp.tie{color:var(--tie)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.fadein{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.final{display:flex;flex-direction:column;gap:10px}
.dlg-foot:empty{display:none}
.board,.hand{perspective:800px}
@media (prefers-reduced-motion:reduce){.srow.won{animation:none;border-color:var(--honey)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h1 data-en="Bear Balance">熊之平衡</h1><span class="mode-tag" id="modeTag">人机</span>
      <button class="btn ghost" id="menuBtn" type="button" style="font-size:13px;padding:3px 12px" data-en="Lobby">大厅</button>
      <button class="btn ghost" id="langBtn" type="button" style="font-size:13px;padding:3px 12px" aria-label="Language / 语言">EN</button>
    </div>
    <ul class="rounds" id="rounds"></ul>
  </header>

  <section class="side" id="oppSide" aria-label="对手" data-aria-en="Opponent">
    <div class="meta">
      <span class="who" data-en="Opponent">对手</span><span class="pips" id="oppPips"></span>
      <span id="oppTags"></span><span class="spacer"></span>
      <span class="count" id="oppCount"></span>
    </div>
    <div class="backs" id="oppBacks"></div>
    <div class="board" id="oppBoard"></div>
  </section>

  <section class="center">
    <div class="scale" aria-hidden="true">
      <div class="post"></div><div class="foot"></div>
      <div class="beam" id="beam"></div><div class="pivot"></div>
      <div class="pan l" id="panL"><div class="str"></div><div class="bowl"><div class="num" id="totP">0</div><div class="lbl" data-en="You">你</div></div></div>
      <div class="pan r" id="panR"><div class="str"></div><div class="bowl"><div class="num" id="totA">0</div><div class="lbl" data-en="Opp.">对手</div></div></div>
    </div>
    <div class="phase" id="phase"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="actions" id="actions"></div>
  </section>

  <section class="side" id="mySide" aria-label="你" data-aria-en="You">
    <div class="board" id="myBoard"></div>
    <div class="meta">
      <span class="who" data-en="You">你</span><span class="pips" id="myPips"></span>
      <span id="myTags"></span><span class="spacer"></span>
      <span class="count" id="myCount"></span>
    </div>
    <div class="aside" id="aside" hidden></div>
    <div class="hand" id="hand"></div>
  </section>

  <div class="info">
    <div class="panel">
      <h2 data-en="Opponent’s 16 cards">对手的 16 张牌</h2>
      <div class="chips" id="oppTrack"></div>
      <p data-en="Crossed out = already played. The rest are in the opponent’s hand or deck.">划掉的已经打出，其余在对手手牌或牌库里。</p>
    </div>
    <div class="panel">
      <h2 data-en="Your deck">你的牌库</h2>
      <div class="chips" id="myDeck"></div>
      <p data-en="Values still in your deck (order unknown). Dashed = set aside while swapping.">牌库里有哪些点数（顺序未知）。虚线是换牌阶段暂时放在一旁的牌。</p>
    </div>
  </div>

  <details class="panel">
    <summary data-en="Game log">对局记录</summary>
    <ol class="log" id="log" reversed></ol>
  </details>
</div>

<div class="fx" id="fx" hidden></div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dialog"></div></div>


<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const sum=a=>a.reduce((x,y)=>x+y,0);
const CN=['一','二','三'];
/* 语言：中文 / English。记在本机，默认跟随浏览器语言 */
let LANG=(()=>{try{const v=localStorage.getItem('bb-lang');if(v==='zh'||v==='en')return v;}catch(e){}return /^zh/i.test(navigator.language||'')?'zh':'en';})();
const T=(zh,en)=>LANG==='en'?en:zh;
const TT=x=>Array.isArray(x)?T(x[0],x[1]):(x||'');
const RD=r=>T(`第${CN[r-1]}局`,`Round ${r}`);
const rpsN=k=>TT(RPS[k]);
function logText(l){
  const t=TT(l.t),pre=TT(l.pre);
  if(LANG==='en'){const w=l.who?(l.who==='p'?'You':'Opponent'):'';
    return t.includes('{w}')?pre+t.replace('{w}',w):pre+(w?w+' ':'')+t;}
  return pre+(l.who?(l.who==='p'?'你':'对手'):'')+t;
}
function applyLang(){
  document.documentElement.lang=LANG==='en'?'en':'zh-CN';
  document.title=T('熊之平衡','Bear Balance');
  document.querySelectorAll('[data-en]').forEach(el=>{if(el.dataset.zh==null)el.dataset.zh=el.textContent;el.textContent=LANG==='en'?el.dataset.en:el.dataset.zh;});
  document.querySelectorAll('[data-aria-en]').forEach(el=>{if(el.dataset.ariaZh==null)el.dataset.ariaZh=el.getAttribute('aria-label');el.setAttribute('aria-label',LANG==='en'?el.dataset.ariaEn:el.dataset.ariaZh);});
  const b=document.getElementById('langBtn');if(b)b.textContent=LANG==='en'?'中文':'EN';
}
function setLang(l){LANG=l;try{localStorage.setItem('bb-lang',l);}catch(e){}applyLang();lastKey='';render();}
const other=w=>w==='p'?'a':'p';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const PFX='bearbalance-v1-';
const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:5},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');

/* ================= Engine =================
   Runs on the AI-game device, or on the room host for online play.
   Seat 'p' = this device, seat 'a' = AI or remote guest. */
let S=null;
function newPlayer(){return{deck:shuffle(Array.from({length:16},(_,i)=>i+1)),hand:[],board:[],passed:false,aside:[],swaps:0,played:[]};}
function newGame(mode){
  disarm();
  S={mode,round:1,phase:'mull',first:null,bonus:null,turn:null,wins:{p:0,a:0},pl:{p:newPlayer(),a:newPlayer()},results:[],log:[],busy:false,
     notes:{p:'',a:''},fresh:null,fn:0,mdone:{p:false,a:false},ready:{p:false,a:false},ended:null,rps:{p:null,a:null},rpsLast:null,gid:Math.random().toString(36).slice(2,8),rpsN:0};
  S.phase='rps';
  L(null,mode==='ai'?['选择先手或后手，也可以猜拳决定。','Choose to go first or second, or play rock-paper-scissors.']:['猜拳决定先后手，赢的一方先手。','Rock-paper-scissors decides who goes first.'],true);
}
const RPS={rock:['石头','Rock'],scissors:['剪刀','Scissors'],paper:['布','Paper']},BEAT={rock:'scissors',scissors:'paper',paper:'rock'};
function pickRps(w,v){
  if(S.phase!=='rps'||S.rps[w]||!RPS[v])return;
  S.rps[w]=v;
  if(S.mode==='ai'&&!S.rps.a)S.rps.a=Object.keys(RPS)[Math.floor(Math.random()*3)];
  if(!(S.rps.p&&S.rps.a)){update();return;}
  const{p,a}=S.rps;S.rps={p:null,a:null};
  if(p===a){S.rpsLast={p,a,res:'tie',n:S.gid+(++S.rpsN)};L(null,[`猜拳：双方都出${RPS[p][0]}，平局重来`,`RPS: both threw ${RPS[p][1]}, replay`]);update();return;}
  const win=BEAT[p]===a?'p':'a';
  S.rpsLast={p,a,res:win,n:S.gid+(++S.rpsN)};setFirst(win,'rps');
}
function setFirst(win,how){
  if(S.phase!=='rps')return;
  S.first=win;S.bonus=win;
  for(const w of['p','a']){draw(w,10);sortHand(w);}
  S.pl[win].swaps=3;S.pl[other(win)].swaps=2;
  if(how==='rps')L(win,['猜拳获胜，先手；第一局先手直接获得 3 点。','won rock-paper-scissors — first player, +3 in round 1.'],true);
  else L(win,['先手，第一局先手直接获得 3 点。','— first player, +3 in round 1.'],true,['选定先后手：','Sides chosen: ']);
  S.phase='mull';
  if(S.mode==='ai')aiMulligan();
  arm('mull',T_MULL+(how==='rps'?4200:1800)); // 留出猜拳和发牌动画的时间
  update();
}
/* 限时：调度 20 秒、出牌 40 秒。计时只在本机（人机）或房主（联机）上跑。 */
let TMR=null;
const T_MULL=20000,T_PLAY=40000,T_NEXT=4800; // 结算动画约 1.8 秒，再停 3 秒自动进入下一局
function arm(kind,ms){clearTimeout(TMR);S.dl=Date.now()+ms;S.dlKind=kind;const g=S;TMR=setTimeout(()=>{if(S===g)onTimeout(kind);},ms);}
function disarm(){clearTimeout(TMR);TMR=null;if(S){S.dl=null;S.dlKind=null;}}
function onTimeout(kind){
  if(kind==='mull'&&S.phase==='mull'){for(const w of['p','a'])if(S.phase==='mull'&&!S.mdone[w]){L(w,['换牌超时，自动完成换牌','ran out of time — swapping finished']);doneMull(w);}}
  else if(kind==='play'&&S.phase==='play'&&!S.pl[S.turn].passed){L(S.turn,['出牌超时','ran out of time']);doPass(S.turn);}
  else if(kind==='next'&&S.phase==='roundEnd')nextRound();
}
function L(who,t,r,pre){S.log.push({who,t,r:!!r,pre:pre||''});if(S.log.length>80)S.log.shift();}
function draw(w,n){const p=S.pl[w];let k=0;while(k<n&&p.deck.length){p.hand.push(p.deck.pop());k++;}return k;}
function sortHand(w){S.pl[w].hand.sort((a,b)=>a-b);}
function swapCard(w,card){
  const p=S.pl[w];if(p.swaps<=0||!p.deck.length||!p.hand.includes(card))return null;
  p.hand.splice(p.hand.indexOf(card),1);p.aside.push(card);
  const nc=p.deck.pop();p.hand.push(nc);p.swaps--;sortHand(w);return nc;
}
function endMull(w){const p=S.pl[w];p.deck.push(...p.aside);p.aside=[];shuffle(p.deck);p.swaps=0;}
function total(w){return sum(S.pl[w].board)+(S.round===1&&S.bonus===w?3:0);}

// 人机：按模拟求出的近似均衡，每局随机选一种风格（先后手不同）
const AI_STYLES={
  first:[[.76,{m1:2,m2:4,B1:40,J:2,sL:18,sT:-15,tie1:true,raise1:true}],
         [.10,{m1:-4,m2:2,B1:6,J:8,sL:11,sT:-14,tie1:true,raise1:true}],
         [.14,{m1:-4,m2:0,B1:6,J:5,sL:12,sT:-14,tie1:true,raise1:true}]],
  second:[[.67,{m1:2,m2:-1,B1:40,J:2,sL:8,sT:-13,tie1:true,raise1:true}],
          [.28,{m1:0,m2:2,B1:0,J:8,sL:1,sT:-11,tie1:false,raise1:true}],
          [.05,{m1:-2,m2:-1,B1:12,J:8,sL:7,sT:-10,tie1:true,raise1:true}]]};
function aiStyle(){
  if(!S.aiP){const Ls=AI_STYLES[S.first==='a'?'first':'second'];let r=Math.random(),k=0;
    while(k<Ls.length-1&&r>=Ls[k][0]){r-=Ls[k][0];k++;}S.aiP=Ls[k][1];}
  return S.aiP;
}
function aiMulligan(){
  const P=aiStyle(),p=S.pl.a,off=isFinal()?0:S.round===1?P.m1:P.m2;let n=0;
  while(p.swaps>0&&p.deck.length){
    const avg=sum(p.deck)/p.deck.length;
    if(p.hand[0]<avg+off){swapCard('a',p.hand[0]);n++;}else break;
  }
  if(n)L('a',[`调度了 ${n} 次`,`swapped ${n} card${n>1?'s':''}`]);
  endMull('a');S.mdone.a=true;
}
function aiDecide(){
  const P=aiStyle(),me=S.pl.a,op=S.pl.p,hand=me.hand.slice().sort((x,y)=>x-y);
  const d=total('p')-total('a'),spent=sum(me.board),nThis=me.board.length;
  const atLeast=x=>hand.find(c=>c>=x);
  const dump=()=>(hand.length&&hand[0]<=P.J&&nThis<3)?hand[0]:null;
  if(S.round===1){
    if(op.passed){
      if(d<0||(d===0&&P.tie1))return null;
      const c=atLeast(d+1);if(c!==undefined&&spent+c<=P.B1)return c;
      if(P.tie1&&hand.includes(d)&&spent+d<=P.B1)return d;
      return null;
    }
    if(d<=0){
      if(P.raise1&&hand.length&&spent+hand[0]<=P.B1)return hand[0];
      if(d<0)return null;
    }
    const c=atLeast(d+1);if(c!==undefined&&spent+c<=P.B1)return c;
    if(P.tie1&&d>0&&hand.includes(d)&&spent+d<=P.B1)return d;
    return dump();
  }
  // 第二局是赛点：不放弃。只有对手已经放弃、自己已经够赢（领先方打平即可）才停手
  const need=S.wins.a>S.wins.p?d:d+1;
  if(!hand.length||(op.passed&&need<=0))return null;
  if(need<=0)return hand[0];
  const c=atLeast(need);return c!==undefined?c:hand[hand.length-1];
}
function aiAct(){
  if(S.mode!=='ai'||S.phase!=='play'||S.turn!=='a')return;
  const c=aiDecide();
  if(c===null||c===undefined)doPass('a');else doPlay('a',c);
}
function doneMull(w){
  if(S.phase!=='mull'||S.mdone[w])return;
  endMull(w);S.mdone[w]=true;S.notes[w]='';
  if(S.mdone.p&&S.mdone.a)startPlay();else update();
}
const isFinal=()=>S.round===3||(S.wins.p>=1&&S.wins.a>=1);
function startPlay(){
  disarm();
  S.notes={p:'',a:''};
  if(isFinal()){autoR3();return;}
  S.phase='play';S.turn=S.first;
  L(S.first,['先出牌','First to play: {w}.'],true,[`第${CN[S.round-1]}局开始，`,`Round ${S.round} begins. `]);
  schedule();
}
function schedule(){
  if(S.phase!=='play')return;
  if(!S.pl[S.turn].hand.length){doPass(S.turn,true);return;}
  arm('play',T_PLAY);
  if(S.mode==='ai'&&S.turn==='a'){
    S.busy=true;update();const g=S;
    setTimeout(()=>{if(S!==g)return;S.busy=false;aiAct();},750);
  }else update();
}
function advance(){
  if(S.pl.p.passed&&S.pl.a.passed){endRound();return;}
  const o=other(S.turn);if(!S.pl[o].passed)S.turn=o;
  schedule();
}
function doPlay(w,card){
  const p=S.pl[w];p.hand.splice(p.hand.indexOf(card),1);p.board.push(card);p.played.push(card);
  S.fresh={w,card,n:++S.fn};L(w,[`打出 ${card}`,`played ${card}`]);advance();
}
function doPass(w,auto){S.pl[w].passed=true;L(w,auto?['没有手牌，自动放弃','had no cards — auto pass']:['放弃跟牌','passed']);advance();}
function endRound(){
  disarm();
  const tp=total('p'),ta=total('a');
  const res=tp>ta?'p':ta>tp?'a':'tie';
  if(res==='tie'){S.wins.p++;S.wins.a++;}else S.wins[res]++;
  S.results.push({p:tp,a:ta,res,cp:[...S.pl.p.board],ca:[...S.pl.a.board],bonus:S.round===1?S.bonus:null});
  L(res==='tie'?null:res,res==='tie'?['平局，双方各得一胜','tie — both score a win']:['赢','won'],true,[`第${CN[S.round-1]}局结束，`,`Round ${S.round} over: `]);
  if(res!=='tie')S.first=res;
  const over=S.wins.p>=2||S.wins.a>=2||S.round===3;
  S.phase=over?'over':'roundEnd';
  S.ready={p:false,a:S.mode==='ai'};
  if(!over)arm('next',T_NEXT);
  update();
}
function setReady(w){
  if(S.phase!=='roundEnd'&&S.phase!=='over')return;
  S.ready[w]=true;
  if(!(S.ready.p&&S.ready.a)){update();return;}
  if(S.phase==='over'){newGame(S.mode);update();}else nextRound();
}
function nextRound(){
  disarm();
  S.round++;S.fresh=null;
  for(const w of['p','a']){
    const p=S.pl[w];p.board=[];p.passed=false;
    const room=Math.max(0,10-p.hand.length),d=Math.min(3,room),got=draw(w,d);
    p.swaps=2+(3-d);sortHand(w);
    const m=[`抽 ${got} 张，可换 ${p.swaps} 次`,`drew ${got}, ${p.swaps} swaps`];
    S.notes[w]=[`本局你${m[0]}。`+(isFinal()?'这是决胜局，换完牌后双方手牌会全部自动打出。':''),`You drew ${got} and have ${p.swaps} swaps.`+(isFinal()?' Deciding round: after swapping, all cards are played automatically.':'')];L(w,m);
    S.mdone[w]=!(p.swaps>0&&p.deck.length);
    if(S.mdone[w])endMull(w);
  }
  if(S.mode==='ai'&&!S.mdone.a)aiMulligan();
  S.phase='mull';
  if(S.mdone.p&&S.mdone.a)startPlay();else{arm('mull',T_MULL);update();}
}
function autoR3(){
  S.phase='auto';
  for(const w of['p','a']){const p=S.pl[w];p.board=[...p.hand];p.played.push(...p.hand);p.hand=[];p.passed=true;}
  L(null,['双方手牌全部自动打出','all cards played automatically'],true,[`第${CN[S.round-1]}局是决胜局：`,`Round ${S.round} is the decider: `]);
  update();const g=S;setTimeout(()=>{if(S===g)endRound();},1400);
}
function resign(w){if(S.phase==='over')return;disarm();S.phase='over';S.ended=w;S.ready={p:false,a:false};L(w,['认输','resigned'],true);update();}

/* Apply an action from seat w. */
function apply(w,type,c){
  if(!S)return;
  if(type==='swap'){
    if(S.phase!=='mull'||S.mdone[w])return;
    const nc=swapCard(w,c);if(nc==null)return;
    const p=S.pl[w];
    if(p.swaps<=0||!p.deck.length){
      L(w,['换牌次数用完，自动完成换牌','used all swaps — swapping done']);doneMull(w);
      if(S.phase==='mull')S.notes[w]=[`你换掉 ${c}，抽到 ${nc}。换牌次数已用完，自动完成换牌。`,`You swapped ${c} for ${nc}. No swaps left — swapping done.`];
      update();return;
    }
    S.notes[w]=[`你换掉 ${c}，抽到 ${nc}`,`You swapped ${c} for ${nc}.`];update();
  }else if(type==='done')doneMull(w);
  else if(type==='play'){
    if(S.phase==='play'&&S.turn===w&&!S.pl[w].passed&&!S.busy&&S.pl[w].hand.includes(c))doPlay(w,c);
  }else if(type==='pass'){
    if(S.phase==='play'&&S.turn===w&&!S.pl[w].passed&&!S.busy)doPass(w);
  }else if(type==='ready')setReady(w);
  else if(type==='resign')resign(w);
  else if(type==='rps')pickRps(w,c);
  else if(type==='pickFirst'&&S.mode==='ai'&&S.phase==='rps')setFirst(c==='me'?w:other(w),'pick');
}

/* What seat `me` is allowed to see. */
function viewFor(me){
  const op=other(me),F=w=>w===me?'p':w===op?'a':w;
  const P=S.pl[me],A=S.pl[op];
  let phase=S.phase;if(phase==='mull'&&S.mdone[me])phase='waitMull';
  if(phase==='rps'&&S.rps[me])phase='waitRps';
  const rl=S.rpsLast;
  return{mode:S.mode,round:S.round,phase,first:F(S.first),bonus:F(S.bonus),turn:F(S.turn),
    wins:{p:S.wins[me],a:S.wins[op]},tot:{p:total(me),a:total(op)},
    results:S.results.map(r=>({p:r[me],a:r[op],res:r.res==='tie'?'tie':F(r.res),cp:me==='p'?r.cp:r.ca,ca:me==='p'?r.ca:r.cp,bonus:r.bonus?F(r.bonus):null})),
    log:S.log.map(l=>({who:l.who?(l.who===me?'p':'a'):null,t:l.t,pre:l.pre,r:l.r})),
    busy:S.busy&&S.turn===op,note:S.notes[me],fresh:S.fresh&&{w:F(S.fresh.w),card:S.fresh.card,n:S.fresh.n},
    gid:S.gid,ready:{p:S.ready[me],a:S.ready[op]},left:S.dl?Math.max(0,S.dl-Date.now()):null,ended:S.ended?F(S.ended):null,
    rpsMine:S.rps?S.rps[me]:null,rpsLast:rl&&{p:rl[me],a:rl[op],res:rl.res==='tie'?'tie':F(rl.res),n:rl.n},
    pl:{p:{deck:[...P.deck],hand:[...P.hand],aside:[...P.aside],swaps:P.swaps,board:[...P.board],passed:P.passed,played:[...P.played]},
        a:{deckCount:A.deck.length+A.aside.length,handCount:A.hand.length,board:[...A.board],passed:A.passed,played:[...A.played]}}};
}

/* ================= Network (PeerJS) ================= */
const UI={prevHand:null,prevBoard:{p:0,a:0},rpsSeen:null,sel:null,selKey:'',role:'ai',ov:'home',view:null,dismissed:'',animN:-1,err:'',code:'',kind:'',confirmResign:false,qStart:0};
const NET={peer:null,lobby:null,conn:null,timer:null,qNext:null};
const QSLOTS=4,QMAX=180000;let qGen=0;
const qAlive=g=>g===qGen&&UI.ov==='searching'&&UI.kind==='quick';

function update(){
  if(UI.role==='host'&&NET.conn&&NET.conn.open){try{NET.conn.send({type:'view',v:viewFor('a')});}catch(e){}}
  render();
}
function act(type,c){
  if(UI.role==='guest'){if(NET.conn&&NET.conn.open)NET.conn.send({type,c});}
  else apply('p',type,c);
}
function netReset(){
  clearTimeout(NET.timer);qGen++;NET.qNext=null;
  const {peer,lobby,conn}=NET;NET.peer=NET.lobby=NET.conn=null;
  try{conn&&conn.close();}catch(e){}
  try{lobby&&lobby.destroy();}catch(e){}
  try{peer&&peer.destroy();}catch(e){}
}
function openPeer(id){
  return new Promise((res,rej)=>{
    let p;try{p=id?new Peer(id,{debug:0}):new Peer({debug:0});}catch(e){rej(e);return;}
    const onErr=e=>{p.off('open',onOpen);try{p.destroy();}catch(x){}rej(e);};
    const onOpen=()=>{p.off('error',onErr);res(p);};
    p.once('open',onOpen);p.once('error',onErr);
  });
}
function errText(e){
  const t=e&&e.type;
  const m={'peer-unavailable':['没有找到这个房间号，或房主已离开','Room not found, or the host has left'],'network':['网络连接失败，请检查网络后重试','Network error — check your connection and try again'],'server-error':['联机服务暂时不可用，请稍后再试','The online service is unavailable — try again later'],
    'browser-incompatible':['这个浏览器不支持联机，请换用 Chrome、Edge 或 Safari','This browser can’t play online — try Chrome, Edge or Safari'],'socket-error':['联机服务连接中断','Lost connection to the online service']}[t];
  return m?TT(m):T('联机出错：','Connection error: ')+(t||e&&e.message||T('未知错误','unknown'));
}
function fail(msg){UI.canResume=false;netReset();UI.role='ai';UI.err=msg;UI.ov='home';newGame('ai');render();}
function onPeerError(e){
  if(UI.ov==='searching'&&UI.kind==='quick'&&e&&e.type==='peer-unavailable'){
    if(NET.qNext)NET.qNext();else qRetry();return;
  }
  if(UI.role==='host'&&NET.conn&&e&&e.type==='peer-unavailable')return;
  fail(errText(e));
}
function onConnClose(c){
  if(c!==NET.conn)return;
  NET.conn=null;
  if(UI.kind==='quick'&&UI.ov==='searching'){qRetry();return;}
  if(UI.role==='host'||UI.role==='guest'){UI.ov='disconnected';render();}
}
function acceptConn(c){
  if(NET.conn){c.on('open',()=>{try{c.send({type:'full'});}catch(e){}setTimeout(()=>{try{c.close();}catch(e){}},400);});return;}
  NET.conn=c;
  if(UI.kind==='quick'){clearTimeout(NET.timer);NET.timer=setTimeout(()=>{if(NET.conn===c&&!c.open&&UI.ov==='searching')qRetry();},12000);}
  c.on('open',()=>{
    clearTimeout(NET.timer);NET.qNext=null;
    if(NET.lobby){try{NET.lobby.destroy();}catch(e){}NET.lobby=null;}

function connectTo(id){

/* Quick match: several lobby slots so one dead/ghost lobby can't block everyone.
   Each searcher first opens its own game peer, then tries slot 0,1,2…: claim a free slot and wait,
   or ask the slot holder for its game code. Dead slots time out and the searcher moves on;
   holders on a higher slot periodically restart from slot 0 so two waiting players always meet. */
function qRetry(delay){
  const g=qGen;
  setTimeout(()=>{if(g===qGen&&UI.ov==='searching'&&UI.kind==='quick')quickMatch(true);},delay||600);
  try{NET.conn&&NET.conn.close();}catch(e){}NET.conn=null;
}
async function quickMatch(retry){
  netReset();const g=qGen;
  if(!retry){UI.qStart=Date.now();}
  UI.role='ai';UI.view=null;UI.err='';UI.kind='quick';UI.ov='searching';render();
  if(Date.now()-UI.qStart>QMAX){fail(T('暂时没有找到对手，请稍后再试','No opponent found — try again later'));return;}
  try{
    let peer=null,code='';
    for(let i=0;i<5&&!peer;i++){code=genCode();try{peer=await openPeer(PFX+code);}catch(e){if(e.type!=='unavailable-id')throw e;}}
    if(!peer)throw{type:'server-error'};
    if(!qAlive(g)){try{peer.destroy();}catch(e){}return;}
    NET.peer=peer;UI.code=code;
    peer.on('connection',acceptConn);peer.on('error',onPeerError);
    peer.on('disconnected',()=>{if(qAlive(g))qRetry(1500);});
    qSlot(g,0);
  }catch(e){if(qAlive(g))fail(errText(e));}
}
async function qSlot(g,k){
  if(!qAlive(g))return;
  if(k>=QSLOTS){qRetry(3000);return;}
  let lobby=null;
  try{lobby=await openPeer(PFX+'lobby'+k);}
  catch(e){
    if(!qAlive(g))return;
    if(e.type==='unavailable-id'){qJoinSlot(g,k);return;}
    fail(errText(e));return;
  }
  if(!qAlive(g)){try{lobby.destroy();}catch(e){}return;}
  NET.lobby=lobby;
  const code=UI.code;
  lobby.on('connection',c=>{const tell=()=>{try{c.send({type:'redirect',code});}catch(e){}};c.on('open',()=>{tell();setTimeout(()=>{try{c.close();}catch(e){}},3000);});c.on('data',tell);});
  lobby.on('error',()=>{});
  lobby.on('disconnected',()=>{if(qAlive(g))qRetry(1500);});
  clearTimeout(NET.timer);
  if(k>0)NET.timer=setTimeout(()=>{if(qAlive(g)&&!NET.conn)quickMatch(true);},20000);
}
function qJoinSlot(g,k){
  const lc=NET.peer.connect(PFX+'lobby'+k,{reliable:true});
  let done=false;
  const next=()=>{if(done||!qAlive(g))return;done=true;NET.qNext=null;clearTimeout(NET.timer);try{lc.close();}catch(e){}qSlot(g,k+1);};
  NET.qNext=next;
  clearTimeout(NET.timer);NET.timer=setTimeout(next,6000);
  lc.on('open',()=>{try{lc.send({type:'hi'});}catch(e){}});
  lc.on('data',m=>{
    if(done||!qAlive(g)||!m||m.type!=='redirect'||!m.code||m.code===UI.code)return;
    done=true;NET.qNext=null;clearTimeout(NET.timer);try{lc.close();}catch(e){}
    connectTo(PFX+m.code);
  });
  lc.on('close',()=>{if(!done)setTimeout(next,300);});
}

function dealFly(el,from,delay,glow){

function fxAfter(snap,V){
  const P=V.pl.p,A=V.pl.a;
  let pb=UI.prevBoard.p,ab=UI.prevBoard.a;
  if(P.board.length<pb)pb=0;if(A.board.length<ab)ab=0;
  let prev=UI.prevHand;
  if(UI.prevGid!==V.gid){UI.prevGid=V.gid;prev=prev?[]:null;pb=0;ab=0;}
  UI.prevHand=[...P.hand];UI.prevBoard={p:P.board.length,a:A.board.length};
  if(reduced()||!prev)return;
  [...document.querySelectorAll('#myBoard .card')].slice(pb).forEach((el,i)=>flyFrom(el,snap.hand.get(cardVal(el)),i*90,false));
  [...document.querySelectorAll('#oppBoard .card')].slice(ab).forEach((el,i)=>flyFrom(el,snap.ob,i*90,true));
  const added=P.hand.filter(c=>!prev.includes(c)),removed=prev.filter(c=>!P.hand.includes(c)&&!P.board.includes(c));
  const chips=document.querySelectorAll('#aside .chip');
  const target=(chips.length?chips[chips.length-1]:$('#myDeck')).getBoundingClientRect();
  removed.forEach(c=>{const r=snap.hand.get(c);if(r)ghostTo(c,r,target);});
  const mull=V.phase==='mull'||V.phase==='waitMull';
  if(!removed.length&&added.length){ // 从牌库抽牌：一张张飞进手牌
    const first=prev.length===0&&added.length>=5;
    const base=first?(V.rpsLast&&V.rpsLast.n!==UI.rpsSeen?2600:200):150,gap=first?120:160;
    const from=$('#myCount').getBoundingClientRect();
    added.forEach((c,i)=>{const el=document.querySelector(`#hand .card[data-c="${c}"]`);if(el)dealFly(el,from,base+i*gap,!first&&mull);});
    if(first){const ofrom=$('#oppCount').getBoundingClientRect();document.querySelectorAll('#oppBacks .back').forEach((b,i)=>dealFly(b,ofrom,base+60+i*gap,false));}
    return;
  }
  added.forEach((c,i)=>{const el=document.querySelector(`#hand .card[data-c="${c}"]`);if(el)dealIn(el,(removed.length?220:0)+i*(added.length>4?60:110),mull&&prev.length>0);});
}

function runCounters(root){
  root.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count,dur=+el.dataset.dur||800;
    if(reduced()){el.textContent=to;return;}
    const t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*k);if(k<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);

function settleHTML(r){
  const lenP=r.cp.length+(r.bonus==='p'?1:0),lenA=r.ca.length+(r.bonus==='a'?1:0);

  };

  <li>双方各有一副 1–16 的牌。开局抽 10 张，手牌上限 10。先手可换牌 3 次，后手 2 次，换下的牌在换牌结束前不会再抽到。</li>

document.addEventListener('click',e=>{

  if(id==='modeQuick'){quickMatch(false);return;}

  if(id==='modeJoin'){joinRoom();return;}
  if(id==='langBtn'||id==='langBtn2'){setLang(LANG==='en'?'zh':'en');return;}
  if(id==='menuBtn'){UI.ov='home';UI.err='';UI.canResume=true;UI.confirmResign=false;render();return;}
  if(id==='resume'){UI.ov=null;UI.canResume=false;render();return;}
  if(id==='toLobby'){toHome();return;}
  if(id==='copyCode'){try{navigator.clipboard.writeText(UI.code).then(()=>{t.textContent=T('已复制','Copied');},()=>{t.textContent=T('请手动复制','Copy it manually');});}catch(err){t.textContent=T('请手动复制','Copy it manually');}return;}
  if(id==='readyBtn'){act('ready');return;}

  if(id==='close'){const V=currentView();if(V)UI.dismissed=V.phase+V.round+V.results.length;render();return;}
  if(id==='doneMull'){act('done');return;}
  if(id==='passBtn'){act('pass');return;}
  if(t.dataset.rps){act('rps',t.dataset.rps);return;}
  if(t.dataset.first){act('pickFirst',t.dataset.first);return;}
  if(t.classList.contains('card')){
    const V=currentView();if(!V)return;const c=+t.dataset.c;
    if(UI.sel!==c){UI.sel=c;render();return;}
    UI.sel=null;
    if(V.phase==='mull')act('swap',c);else if(V.phase==='play')act('play',c);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id!=='codeIn')return;
  const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5);
  if(v!==e.target.value)e.target.value=v;
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codeIn')joinRoom();});
window.addEventListener('beforeunload',()=>{netReset();});

applyLang();newGame('ai');render();

</script>
</body>
</html>
